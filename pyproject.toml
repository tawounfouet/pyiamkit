[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyiamkit"
version = "0.1.0b2"
description = "Framework-agnostic Python foundations for IAM, RBAC, multi-tenancy and authorization."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Thomas Awounfouet" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/tawounfouet/pyiamkit"
Issues = "https://github.com/tawounfouet/pyiamkit/issues"

[project.optional-dependencies]
postgres = [
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
]
redis = ["redis>=5,<7"]
fastapi = ["fastapi>=0.115"]
django = ["django>=5"]

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
]
security = [
  "bandit>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyiamkit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/PUBLIC_API.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["pyiamkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
  "unit: fast isolated tests",
  "integration: integration tests",
  "conformance: adapter contract tests",
  "security: security-focused tests",
  "slow: slow-running tests",
]

[tool.coverage.run]
branch = true
source = ["pyiamkit"]

[tool.coverage.report]
show_missing = true
skip_covered = false
