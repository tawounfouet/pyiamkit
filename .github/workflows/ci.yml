name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build mypy pytest pytest-cov ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests and coverage
        run: pytest --cov=pyiamkit --cov-report=term-missing --cov-fail-under=90
      - name: Build
        run: python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke import
        run: python scripts/smoke_install.py
      - name: Run examples
        run: |
          for example in examples/*.py; do
            python "$example"
          done
