name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sqlalchemy,jwt,oidc,oidc-http,fastapi]"
          python -m pip install build httpx mypy pytest pytest-cov ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests and coverage
        run: pytest --cov=pyiamkit --cov-report=term-missing --cov-fail-under=90
      - name: Build
        run: python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke import
        run: python scripts/smoke_install.py
      - name: Run examples
        run: |
          for example in examples/*.py; do
            python "$example"
          done

  postgres-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pyiamkit
          POSTGRES_PASSWORD: pyiamkit
          POSTGRES_DB: pyiamkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyiamkit -d pyiamkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYIAMKIT_TEST_DATABASE_URL: postgresql+psycopg://pyiamkit:pyiamkit@localhost:5432/pyiamkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL persistence extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[postgres]"
          python -m pip install pytest
      - name: PostgreSQL persistence integration tests
        run: pytest tests/integration/persistence/test_postgresql.py -m integration -q
