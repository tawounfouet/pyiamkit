name: Production Qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rc-baseline-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install RC qualification target
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sqlalchemy]"
          python -m pip install pytest
      - name: Verify production baseline
        run: python scripts/verify_production_baseline.py
      - name: SQLite schema lifecycle
        run: >-
          pytest
          tests/qualification/test_schema_lifecycle.py
          -k sqlite
          -m integration
          -q
      - name: Release evidence unit qualification
        run: pytest tests/qualification/test_release_evidence.py -q

  rc-postgresql-schema-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pyiamkit
          POSTGRES_PASSWORD: pyiamkit
          POSTGRES_DB: pyiamkit_rc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyiamkit -d pyiamkit_rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYIAMKIT_TEST_DATABASE_URL: postgresql+psycopg://pyiamkit:pyiamkit@localhost:5432/pyiamkit_rc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL RC target
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[postgres]"
          python -m pip install pytest
      - name: PostgreSQL schema lifecycle
        run: >-
          pytest
          tests/qualification/test_schema_lifecycle.py
          -k postgresql
          -m integration
          -q

  rc-release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke installed package
        run: python scripts/smoke_install.py
      - name: Generate release evidence
        run: >-
          python scripts/generate_release_evidence.py
          --dist-dir dist
          --output-dir release-evidence
      - name: Verify release evidence files
        run: |
          test -s release-evidence/SHA256SUMS
          test -s release-evidence/sbom.cdx.json
          test -s release-evidence/provenance.json
          python -m json.tool release-evidence/sbom.cdx.json >/dev/null
          python -m json.tool release-evidence/provenance.json >/dev/null
      - name: Upload RC evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyiamkit-rc-release-evidence
          path: |
            dist/
            release-evidence/
